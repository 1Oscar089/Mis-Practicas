<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio de Proyectos</title>
    <!-- Script de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6"
  >
    <main
      class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700"
    >
      <h1 class="text-3xl font-extrabold text-indigo-400 mb-2">
        Mis Proyectos
      </h1>
      <p class="text-slate-400 mb-6">
        Colección de aplicaciones desarrolladas con distintos frameworks.
      </p>

      <nav>
        <ul id="lista-proyectos" class="space-y-3">
          <!-- Iremos agregando los enlaces según vayamos creando cada proyecto -->
          <li>
            <a
              href="./Shiki/"
              class="block p-4 bg-slate-700 hover:bg-indigo-600 transition-colors rounded-lg font-semibold flex items-center justify-between"
            >
              <span>🎨 Resaltador Shiki</span>
              <span class="text-xs bg-slate-600 px-2 py-1 rounded"
                >Vite + Shiki</span
              >
            </a>
          </li>
          <li>
            <a
              href="./TailwindCSS/"
              class="block p-4 bg-slate-700 hover:bg-teal-600 transition-colors rounded-lg font-semibold flex items-center justify-between"
            >
              <span>🎨 Tailwind CSS + Shiki</span>
              <span class="text-xs bg-slate-600 px-2 py-1 rounded">Vite</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
