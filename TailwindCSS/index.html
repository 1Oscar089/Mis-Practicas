<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Modular Funcional</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        button { padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; background: #007bff; color: white; margin-right: 10px; }
        #menu, #app { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #app { display: none; } /* Inicia oculto */
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- El menú inicia visible -->
    <div id="menu"></div>

    <!-- El contenedor de bloques inicia oculto -->
    <div id="app"></div>

    <!-- OBLIGATORIO: type="module" -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
